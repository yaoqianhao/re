[workspace]
resolver = "2"
members = [
    "crates/r3e-core",
    "crates/r3e-render",
    "crates/r3e-physics",
    "crates/r3e-script",
    "crates/r3e-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
authors = ["r3e"]

[workspace.dependencies]
# 内部 crate
r3e-core = { path = "crates/r3e-core" }
r3e-render = { path = "crates/r3e-render" }
r3e-physics = { path = "crates/r3e-physics" }
r3e-script = { path = "crates/r3e-script" }

# 图形
wgpu = "30.0"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }

# 数学
glam = { version = "0.34", features = ["bytemuck"] }

# 脚本
rhai = { version = "1.27", features = ["serde"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 日志与错误
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
