[workspace]
resolver = "2"
members = [
    "crates/r3e-core",
    "crates/r3e-render",
    "crates/r3e-physics",
    "crates/r3e-script",
    "crates/r3e-asset",
    "crates/r3e-app",
    "crates/r3e-editor",
    "crates/r3e-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
authors = ["r3e"]

[workspace.dependencies]
# 内部 crate
r3e-core = { path = "crates/r3e-core" }
r3e-render = { path = "crates/r3e-render" }
r3e-physics = { path = "crates/r3e-physics" }
r3e-script = { path = "crates/r3e-script" }
r3e-asset = { path = "crates/r3e-asset" }
r3e-editor = { path = "crates/r3e-editor" }

# 图形
wgpu = "30.0"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1.21", features = ["derive"] }

# 数学
glam = { version = "0.34", features = ["bytemuck"] }

# 脚本
rhai = { version = "1.27", features = ["serde"] }

# 输入设备（手柄：Windows 走 XInput / WGI）
gilrs = "0.11"

# 物理后端（可选）：r3e-physics 的 `rapier` feature 打开时才真正编译
rapier3d = "0.36"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 日志与错误
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# 插件以单个 exe 分发（ai_ide 直接 spawn 它），release 按「瘦二进制」调：
# 去掉符号、跨 crate 内联，换来更小的包和更快的冷启动。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# 插件是子进程：panic 就该整进程退出，让宿主记成崩溃并下架工具，
# 而不是留一个半死不活的进程挂着工具表。
panic = "abort"
