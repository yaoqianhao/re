# 固定工具链：本仓库的 fmt / clippy / test 结果都以这个工具链为准。
# 为什么写全 host triple：本工程是 Windows + MinGW（见 .cargo/config.toml 的 build.target 与 linker），
# rustup 的默认 host 若是 msvc，单写 "stable" 会切到 stable-x86_64-pc-windows-msvc，
# 导致 build script / proc-macro 这些 host 产物去找 link.exe 而失败。写全 triple 才不会漂。
# 实测版本：rustc 1.99.1 / rustfmt 1.10.0。
# 升级步骤：rustup update stable-x86_64-pc-windows-gnu -> cargo fmt --all -> 跑质量门（docs/ARCHITECTURE.md §3.3）-> 提交。
[toolchain]
channel = "stable-x86_64-pc-windows-gnu"
components = ["rustfmt", "clippy"]
profile = "minimal"
