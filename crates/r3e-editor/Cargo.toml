[package]
name = "r3e-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "r3e 编辑器桥的传输层：TCP + NDJSON；协议层见 r3e-protocol"

[dependencies]
# 协议层（消息 / Patch / EngineApi / dispatch）。本 crate 只做传输，并把它的 API
# 整体再导出，保持 `use r3e_editor::…` 的旧调用方零改动。
r3e-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

# 仅测试期用：`tests/cmd_spec_contract.rs` 要把 `known_methods()` 与
# `r3e_core::cmd_spec` 的命令表对齐。r3e-editor 的 dep_rules allow 本来就含 r3e-core，
# 所以这条 dev-dependency 不新增任何依赖边（跑 xtask dep-check 可核）。
[dev-dependencies]
r3e-core.workspace = true
