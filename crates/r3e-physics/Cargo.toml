[package]
name = "r3e-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Rapier 后端：默认不编译，`--features rapier` 才把 rapier3d 拉进来
rapier = ["dep:rapier3d"]

[dependencies]
r3e-core.workspace = true
glam.workspace = true
log.workspace = true

# 仅 `rapier` feature 启用时编译；类型只允许出现在 src/rapier_backend.rs
rapier3d = { workspace = true, optional = true }
