[package]
name = "r3e-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "r3e 运行时：窗口、主循环、固定时间步与无窗口 headless 模式"

[features]
default = []
# 把 Rapier 物理后端编进运行时（由 r3e-app 的 `rapier` feature 转发）。
rapier = ["r3e-physics/rapier"]

[dependencies]
r3e-core.workspace = true
r3e-doc.workspace = true
r3e-asset.workspace = true
r3e-audio.workspace = true
r3e-render.workspace = true
r3e-terrain.workspace = true
r3e-physics.workspace = true
r3e-script.workspace = true
rhai.workspace = true
serde_json.workspace = true
winit.workspace = true
wgpu.workspace = true
gilrs.workspace = true
pollster.workspace = true
glam.workspace = true
log.workspace = true
anyhow.workspace = true
