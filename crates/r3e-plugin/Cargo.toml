[package]
name = "r3e-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rust3d-engine 的 ai_ide 插件入口：原生子进程 + NDJSON over stdio"

[[bin]]
name = "r3e-plugin"
path = "src/main.rs"

[features]
default = []
# M1-S1-D：插件不再链接 `r3e-core` / `r3e-physics`，原来的 `rapier` feature
# 只是 `r3e-physics/rapier` 的转发开关，随依赖一起删除。物理后端由**引擎进程**
# 决定（`r3e.exe --physics-backend rapier`），插件只经 `physics.simulate` 请求它。

[dependencies]
serde.workspace = true
serde_json.workspace = true
