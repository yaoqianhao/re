[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "仓库级工程门禁：verify / lint-size / check-tests / dep-check"

[dependencies]
serde_json.workspace = true
# gen-capabilities 要读三源（命令表 / 不变量表 / RPC 方法表），三者都在引擎 crate 里。
# dep-check 只扫 crates/ 下的目录（xtask 不在其中），故这几条依赖不产生依赖违规。
r3e-core.workspace = true
r3e-doc.workspace = true
r3e-protocol.workspace = true
# scene-verify（M1-S4-F）要真跑三层验证器：物理后端、导航烘焙、验证器本体都在引擎里。
# 同上，dep-check 只扫 crates/，这三条不产生依赖违规。
r3e-physics.workspace = true
r3e-nav.workspace = true
r3e-editor-host.workspace = true
